name: Publish OA artifact

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install openpyxl

      - name: Build OA artifact
        run: python3 scripts/publish_oa_artifact.py

      - name: Publish to public artifact repo
        env:
          DEPLOY_KEY: ${{ secrets.OA_ARTIFACT_DEPLOY_KEY }}
          OA_ARTIFACT_REPO: ${{ secrets.OA_ARTIFACT_REPO }}
        run: |
          set -euo pipefail
          REPO="${OA_ARTIFACT_REPO:-martijnroelandse/sciscore-dashboard}"
          if [ -z "${DEPLOY_KEY:-}" ]; then
            echo "::warning::OA_ARTIFACT_DEPLOY_KEY not set — artifact built in dist/oa-public only."
            echo "Add deploy key secret to enable automatic publish. See docs/REPO_SPLIT_MIGRATION.md"
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null || true
          GIT_SSH_COMMAND='ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new' \
            git clone --depth 1 "git@github.com:${REPO}.git" /tmp/oa-public-repo
          rsync -av --delete \
            --exclude .git \
            dist/oa-public/ /tmp/oa-public-repo/
          cd /tmp/oa-public-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to publish"
          else
            git commit -m "Publish OA artifact ($(date -u +%Y-%m-%d))"
            GIT_SSH_COMMAND='ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new' \
              git push origin main
          fi
