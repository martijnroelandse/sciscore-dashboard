<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Client sign-in — SciScore Journal Intelligence</title>
  <meta http-equiv="refresh" content="0;url=https://sciscore-client-login.fly.dev/clients/login">
  <style>
    :root {
      --navy: #0b1c3d;
      --blue: #29abe2;
      --text: #e8eef8;
      --muted: #9bb0cc;
      --border: rgba(41,171,226,0.28);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(1200px 600px at 20% -10%, #14305f 0%, var(--navy) 55%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: min(480px, 100%);
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(0,0,0,0.22);
      padding: 28px 24px;
      text-align: center;
    }
    h1 { margin: 0 0 10px; font-size: 1.35rem; }
    p { color: var(--muted); line-height: 1.55; margin: 0 0 18px; }
    a.btn {
      display: inline-block;
      text-decoration: none;
      border-radius: 8px;
      padding: 11px 16px;
      font-weight: 600;
      font-size: 0.9rem;
      background: var(--blue);
      color: var(--navy);
    }
    a.secondary {
      display: inline-block;
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Continue to client sign-in</h1>
    <p>
      Publisher clients sign in on the SciScore client portal to download
      organization-scoped metrics CSV.
    </p>
    <a class="btn" href="https://sciscore-client-login.fly.dev/clients/login">Go to sign-in</a>
    <br>
    <a class="secondary" href="../SciScore_journal_dashboard.html">Back to open-access dashboard</a>
  </main>
</body>
</html>
